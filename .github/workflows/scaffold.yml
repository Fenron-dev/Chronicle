# Datei: .github/workflows/scaffold.yml
#
# ZWECK: Erzeugt die nativen Plattform-Ordner (android/, ios/, linux/, macos/,
#        windows/) per `flutter create` und committet sie zurück.
#
# WARUM ALS WORKFLOW: Diese Ordner entstehen normalerweise beim ersten lokalen
#        `flutter create` — und lokale Builds sind projektweit verboten
#        (CLAUDE.md §2.1). Also erzeugt sie die CI.
#
# WANN AUSFÜHREN: Einmalig zu Projektbeginn, und später, wenn eine Plattform
#        dazukommt. Danach sind die Ordner eingecheckt und nativ anpassbar
#        (media_kit-Konfiguration, App-Icons, Entitlements) — ci.yml lässt
#        vorhandene Ordner unberührt.
#
# Manuell starten: Actions → "Scaffold platform folders" → Run workflow.
#
# HINWEIS: Ein Workflow mit ausschließlich `workflow_dispatch` wird von GitHub
#        erst registriert, wenn er auf dem Default-Branch liegt und einmal
#        indiziert wurde. Taucht er unter Actions nicht auf, hilft ein Push,
#        der diese Datei verändert.

name: Scaffold platform folders

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Plattformen (Komma-getrennt)'
        required: true
        default: 'windows,linux,macos,android,ios'

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  scaffold:
    name: flutter create
    # macOS-Runner, weil nur dort auch die ios/- und macos/-Ordner erzeugt
    # werden können.
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Create platform folders
        working-directory: chronicle
        run: |
          flutter create --platforms=${{ inputs.platforms }} \
            --project-name chronicle --org dev.fenron .

      # `flutter create` fasst mehr an als die Plattform-Ordner: es
      # ÜBERSCHREIBT pubspec.yaml und analysis_options.yaml und LEGT Dateien
      # AN, die wir nicht wollen — test/widget_test.dart (der Zähler-
      # Beispieltest), README.md, chronicle.iml, .idea/.
      #
      # Der Beispieltest ist dabei kein Schönheitsfehler: er referenziert
      # `MyApp`, unser Einstiegspunkt heißt `ChronicleApp`. Mitcommittet würde
      # er das nächste CI-Gate rot machen, weil er nicht einmal kompiliert.
      #
      # Ein `git checkout` allein reicht dagegen nicht — es stellt getrackte
      # Dateien wieder her, lässt neu angelegte aber liegen. Deshalb: die
      # Plattform-Ordner beiseiteräumen, alles andere hart zurücksetzen, die
      # Ordner zurückholen.
      - name: Alles außer den Plattform-Ordnern zurücksetzen
        run: |
          set -euo pipefail
          keep="$RUNNER_TEMP/platforms"
          mkdir -p "$keep"
          for dir in android ios linux macos windows; do
            if [ -d "chronicle/$dir" ]; then
              mv "chronicle/$dir" "$keep/"
            fi
          done

          git checkout -- chronicle
          git clean -qfdx chronicle

          for dir in "$keep"/*; do
            [ -e "$dir" ] && mv "$dir" chronicle/
          done

      # Lieber hier scheitern als im nächsten CI-Lauf: ein Commit, der eine
      # Datei außerhalb der Plattform-Ordner enthält, ist ein Fehler in der
      # Aufräumlogik darüber und kein Ergebnis, das wir haben wollen.
      - name: Prüfen, dass nur Plattform-Ordner hinzukommen
        run: |
          set -euo pipefail
          git add -A chronicle
          unerwartet=$(
            git diff --cached --name-only \
              | grep -Ev '^chronicle/(android|ios|linux|macos|windows)/' \
              || true
          )
          if [ -n "$unerwartet" ]; then
            echo "::error::Unerwartete Dateien im Commit:"
            echo "$unerwartet"
            exit 1
          fi
          echo "Vorgemerkt:"
          git diff --cached --name-only | cut -d/ -f2 | sort -u

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Keine Änderungen — Plattform-Ordner sind bereits aktuell."
            exit 0
          fi
          git commit \
            -m "chore(scaffold): Plattform-Ordner für ${{ inputs.platforms }} erzeugen" \
            -m "Erzeugt in der CI, weil lokale Builds projektweit verboten sind (CLAUDE.md §2.1)."
          git push origin HEAD:${{ github.ref_name }}
